<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>何子墨 - 联系我</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #637083;
      --line: rgba(23, 33, 43, 0.13);
      --paper: rgba(255, 255, 255, 0.88);
      --green: #18a058;
      --blue: #1677ff;
      --rose: #d9466f;
      --shadow: 0 24px 70px rgba(27, 39, 55, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, rgba(22, 119, 255, 0.22), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(24, 160, 88, 0.18), transparent 30%),
        linear-gradient(135deg, #f5f9ff 0%, #f7fbf5 48%, #fff7f8 100%);
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    main {
      width: min(960px, 100%);
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 28px;
      align-items: stretch;
    }

    .intro,
    .contacts {
      border: 1px solid var(--line);
      background: var(--paper);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .intro {
      min-height: 520px;
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 28px 8px 8px 28px;
      overflow: hidden;
      position: relative;
    }

    .intro::before {
      content: "";
      position: absolute;
      inset: auto -80px -100px auto;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(22, 119, 255, 0.2), rgba(217, 70, 111, 0.18));
    }

    .tag {
      width: fit-content;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 14px;
      background: rgba(255, 255, 255, 0.58);
    }

    h1 {
      margin: 44px 0 16px;
      font-size: clamp(44px, 8vw, 86px);
      line-height: 1;
      letter-spacing: 0;
    }

    .summary {
      max-width: 430px;
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
    }

    .signature {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      font-size: 15px;
    }

    .mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 22px rgba(27, 39, 55, 0.16);
    }

    .contacts {
      padding: 24px;
      border-radius: 8px 28px 28px 8px;
      display: grid;
      gap: 14px;
      align-content: center;
    }

    .contact {
      min-height: 112px;
      display: grid;
      grid-template-columns: 54px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.72);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .contact:hover,
    .contact:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(22, 119, 255, 0.32);
      box-shadow: 0 14px 34px rgba(27, 39, 55, 0.12);
      outline: none;
    }

    .icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: #fff;
      font-weight: 800;
      font-size: 18px;
    }

    .qq .icon {
      background: var(--blue);
    }

    .wechat .icon {
      background: var(--green);
    }

    .mail .icon {
      background: var(--rose);
    }

    .label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    .value {
      display: block;
      overflow-wrap: anywhere;
      font-size: 22px;
      font-weight: 750;
    }

    .action {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 14px;
      background: rgba(255, 255, 255, 0.8);
      white-space: nowrap;
    }

    button.contact {
      width: 100%;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .toast {
      min-height: 22px;
      margin: 4px 6px 0;
      color: var(--green);
      font-size: 14px;
      text-align: right;
    }

    @media (max-width: 820px) {
      body {
        padding: 18px;
        place-items: start center;
      }

      main {
        grid-template-columns: 1fr;
      }

      .intro,
      .contacts {
        border-radius: 18px;
      }

      .intro {
        min-height: 360px;
        padding: 30px;
      }

      h1 {
        margin-top: 34px;
      }

      .contacts {
        padding: 16px;
      }

      .contact {
        grid-template-columns: 48px 1fr;
        min-height: 104px;
      }

      .icon {
        width: 48px;
        height: 48px;
      }

      .action {
        grid-column: 2;
        width: fit-content;
      }
    }
  </style>
</head>
<body>
  <main aria-label="何子墨的个人联系主页">
    <section class="intro">
      <div>
        <div class="tag">个人主页 / Contact</div>
        <h1>何子墨</h1>
        <p class="summary">你好，这里是我的联系主页。需要找我时，可以直接通过 QQ、微信或邮箱联系。</p>
      </div>
      <div class="signature">
        <img class="mark" src="https://q1.qlogo.cn/g?b=qq&nk=491298200&s=640" alt="何子墨的 QQ 头像">
        <span>He Zimo</span>
      </div>
    </section>

    <section class="contacts" aria-label="联系方式">
      <a class="contact qq" href="tencent://message/?uin=491298200&Site=&Menu=yes" aria-label="通过 QQ 联系何子墨">
        <span class="icon" aria-hidden="true">QQ</span>
        <span>
          <span class="label">QQ</span>
          <span class="value">491298200</span>
        </span>
        <span class="action">发消息</span>
      </a>

      <button class="contact wechat" type="button" id="copyWechat" aria-label="复制微信号 HT-T-TH">
        <span class="icon" aria-hidden="true">微</span>
        <span>
          <span class="label">微信</span>
          <span class="value">HT-T-TH</span>
        </span>
        <span class="action">复制</span>
      </button>

      <a class="contact mail" href="mailto:491298200@qq.com?subject=%E4%BD%A0%E5%A5%BD%EF%BC%8C%E4%BD%95%E5%AD%90%E5%A2%A8" aria-label="给何子墨发送邮件">
        <span class="icon" aria-hidden="true">@</span>
        <span>
          <span class="label">邮箱</span>
          <span class="value">491298200@qq.com</span>
        </span>
        <span class="action">写邮件</span>
      </a>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const copyButton = document.querySelector("#copyWechat");
    const toast = document.querySelector("#toast");

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText("HT-T-TH");
        toast.textContent = "微信号已复制";
      } catch {
        toast.textContent = "微信号：HT-T-TH";
      }

      window.setTimeout(() => {
        toast.textContent = "";
      }, 2200);
    });
  </script>
</body>
</html>
