<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>何子墨 - 联系我</title>
  <link rel="icon" href="https://q1.qlogo.cn/g?b=qq&nk=491298200&s=100">
  <style>
    :root {
      --ink: #1a1a2e;
      --muted: #6b7b8d;
      --line: rgba(255, 255, 255, 0.08);
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent1: #667eea;
      --accent2: #764ba2;
      --accent3: #f093fb;
      --green: #2ecc71;
      --blue: #3b82f6;
      --rose: #f43f5e;
      --shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      min-height: 100%;
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      overflow-x: hidden;
      position: relative;
    }

    /* ── 粒子画布 ── */
    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── 渐变光晕（用渐变代替 blur，零性能开销）── */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      opacity: 0.35;
      z-index: 0;
      will-change: transform;
      animation: floatBlob 14s ease-in-out infinite alternate;
    }
    body::before {
      width: 500px; height: 500px;
      top: -120px; left: -100px;
      background: radial-gradient(circle, rgba(102,126,234,0.5) 0%, transparent 70%);
    }
    body::after {
      width: 450px; height: 450px;
      bottom: -100px; right: -80px;
      background: radial-gradient(circle, rgba(240,147,251,0.45) 0%, transparent 70%);
      animation-delay: -7s;
    }

    @keyframes floatBlob {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.15); }
    }

    /* ── 主容器 ── */
    main {
      position: relative;
      z-index: 1;
      width: min(1000px, 100%);
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 0;
      align-items: stretch;
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── 玻璃卡片通用（半透明代替 backdrop-filter）── */
    .intro, .contacts {
      background: rgba(20, 18, 50, 0.72);
      border: 1px solid var(--glass-border);
    }

    /* ── 左侧介绍 ── */
    .intro {
      min-height: 540px;
      padding: 48px 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 24px 0 0 24px;
      position: relative;
      overflow: hidden;
    }

    .intro::before {
      content: "";
      position: absolute;
      top: -50%; right: -40%;
      width: 320px; height: 320px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(102,126,234,0.18), rgba(240,147,251,0.14));
      animation: pulse 6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0%   { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.25); opacity: 1; }
    }

    .tag {
      width: fit-content;
      padding: 8px 16px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      letter-spacing: 1px;
      background: rgba(255,255,255,0.05);
      animation: fadeUp 0.9s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    h1 {
      margin: 36px 0 18px;
      font-size: clamp(42px, 7vw, 72px);
      line-height: 1.05;
      font-weight: 800;
      color: #fff;
      animation: fadeUp 0.9s 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    h1 .wave {
      display: inline-block;
      animation: wave 2.5s ease-in-out infinite;
      transform-origin: 70% 70%;
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      10%      { transform: rotate(14deg); }
      20%      { transform: rotate(-8deg); }
      30%      { transform: rotate(14deg); }
      40%      { transform: rotate(-4deg); }
      50%      { transform: rotate(10deg); }
      60%      { transform: rotate(0deg); }
    }

    .summary {
      max-width: 420px;
      color: rgba(255,255,255,0.55);
      font-size: 16px;
      line-height: 1.9;
      animation: fadeUp 0.9s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* ── 头像签名 ── */
    .signature {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 16px;
      animation: fadeUp 0.9s 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .avatar-wrap {
      position: relative;
      width: 56px; height: 56px;
    }

    .avatar-wrap::before {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 18px;
      background: conic-gradient(from 0deg, #667eea, #f093fb, #667eea);
      animation: borderSpin 5s linear infinite;
      z-index: -1;
    }

    @keyframes borderSpin {
      to { transform: rotate(360deg); }
    }

    .mark {
      width: 56px; height: 56px;
      border-radius: 16px;
      object-fit: cover;
      border: 2px solid rgba(0,0,0,0.3);
    }

    .sig-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sig-name {
      color: rgba(255,255,255,0.85);
      font-size: 15px;
      font-weight: 600;
    }

    .sig-status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
    }

    .sig-status .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }

    /* ── 右侧联系卡片 ── */
    .contacts {
      padding: 28px 24px;
      border-radius: 0 24px 24px 0;
      display: grid;
      gap: 16px;
      align-content: center;
    }

    .contacts-title {
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 0 4px 4px;
      animation: fadeUp 0.9s 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .contact {
      min-height: 100px;
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 18px 20px;
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      color: inherit;
      text-decoration: none;
      background: rgba(255,255,255,0.04);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .contact::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .qq .contact::before    { background: linear-gradient(135deg, rgba(59,130,246,0.12), transparent); }
    .wechat .contact::before { background: linear-gradient(135deg, rgba(46,204,113,0.12), transparent); }
    .mail .contact::before   { background: linear-gradient(135deg, rgba(244,63,94,0.12), transparent); }
    .telegram .contact::before { background: linear-gradient(135deg, rgba(0,136,204,0.12), transparent); }

    .contact:hover::before,
    .contact:focus-visible::before { opacity: 1; }

    .contact:hover,
    .contact:focus-visible {
      transform: translateY(-4px) scale(1.01);
      border-color: rgba(255,255,255,0.2);
      box-shadow: 0 16px 40px rgba(0,0,0,0.25);
      outline: none;
    }

    .contact:nth-child(1) { animation: fadeUp 0.9s 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .contact:nth-child(2) { animation: fadeUp 0.9s 0.65s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .contact:nth-child(3) { animation: fadeUp 0.9s 0.75s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .contact:nth-child(4) { animation: fadeUp 0.9s 0.85s cubic-bezier(0.22, 1, 0.36, 1) both; }

    .icon {
      width: 52px; height: 52px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #fff;
      font-weight: 800;
      font-size: 17px;
      position: relative;
      z-index: 1;
    }

    .qq .icon    { background: linear-gradient(135deg, #3b82f6, #2563eb); box-shadow: 0 6px 20px rgba(59,130,246,0.35); }
    .wechat .icon { background: linear-gradient(135deg, #2ecc71, #27ae60); box-shadow: 0 6px 20px rgba(46,204,113,0.35); }
    .mail .icon   { background: linear-gradient(135deg, #f43f5e, #e11d48); box-shadow: 0 6px 20px rgba(244,63,94,0.35); }
    .telegram .icon { background: linear-gradient(135deg, #0088cc, #006699); box-shadow: 0 6px 20px rgba(0,136,204,0.35); }

    .icon svg {
      width: 24px; height: 24px;
      fill: currentColor;
    }

    .label {
      display: block;
      margin-bottom: 5px;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      position: relative;
      z-index: 1;
    }

    .value {
      display: block;
      overflow-wrap: anywhere;
      font-size: 20px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      position: relative;
      z-index: 1;
    }

    .action {
      padding: 8px 16px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      background: rgba(255,255,255,0.06);
      white-space: nowrap;
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .contact:hover .action {
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.8);
      border-color: rgba(255,255,255,0.2);
    }

    button.contact {
      width: 100%;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .toast {
      min-height: 22px;
      margin: 2px 6px 0;
      color: var(--green);
      font-size: 13px;
      text-align: right;
      animation: fadeUp 0.5s ease both;
    }

    /* ── 页脚 ── */
    .footer {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.2);
      font-size: 12px;
      z-index: 1;
      letter-spacing: 0.5px;
    }

    /* ── 响应式 ── */
    @media (max-width: 820px) {
      body { padding: 16px; place-items: start center; }

      main { grid-template-columns: 1fr; }

      .intro, .contacts { border-radius: 20px; }

      .intro {
        min-height: 340px;
        padding: 32px 28px;
      }

      h1 { margin-top: 28px; font-size: clamp(36px, 10vw, 52px); }

      .contacts { padding: 20px 16px; border-radius: 20px; margin-top: 0; }

      .contact {
        grid-template-columns: 46px 1fr;
        min-height: 90px;
      }

      .icon { width: 46px; height: 46px; }
      .icon svg { width: 20px; height: 20px; }

      .action { grid-column: 2; width: fit-content; }

      body::before { width: 300px; height: 300px; }
      body::after  { width: 250px; height: 250px; }
    }
  </style>
</head>

  <!-- 粒子背景（轻量优化版） -->
  <script>
    (() => {
      const c = document.getElementById("particles");
      const ctx = c.getContext("2d");
      let W, H, dots = [];

      function resize() {
        W = c.width = innerWidth;
        H = c.height = innerHeight;
      }
      resize();
      addEventListener("resize", resize);

      /* 粒子数减半，去掉连线 */
      const COUNT = Math.min(40, Math.floor(innerWidth * innerHeight / 28000));
      for (let i = 0; i < COUNT; i++) {
        dots.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          r: Math.random() * 1.4 + 0.5,
          o: Math.random() * 0.2 + 0.08,
        });
      }

      /* 降帧：每 2 帧画一次 ≈ 30fps，够流畅且省一半 CPU */
      let tick = 0;
      function draw() {
        if (++tick & 1) { requestAnimationFrame(draw); return; }
        ctx.clearRect(0, 0, W, H);
        for (let i = 0; i < dots.length; i++) {
          const a = dots[i];
          a.x += a.vx; a.y += a.vy;
          if (a.x < 0) a.x = W; if (a.x > W) a.x = 0;
          if (a.y < 0) a.y = H; if (a.y > H) a.y = 0;
          ctx.beginPath();
          ctx.arc(a.x, a.y, a.r, 0, 6.283);
          ctx.fillStyle = `rgba(255,255,255,${a.o})`;
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>

  <!-- 复制微信 -->
  <script>
    const copyButton = document.querySelector("#copyWechat");
    const toast = document.querySelector("#toast");

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText("HT-T-TH");
        toast.textContent = "✓ 微信号已复制";
      } catch {
        toast.textContent = "微信号：HT-T-TH";
      }
      setTimeout(() => { toast.textContent = ""; }, 2200);
    });
  </script>
